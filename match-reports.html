<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Match Report Centre | AND FC</title><link rel="stylesheet" href="style.css"><style>.form-guide{display:flex;gap:6px;flex-wrap:wrap}.form-guide span{padding:5px 10px;border-radius:6px;color:white;font-weight:bold}.win{background:#17663b}.draw{background:#565b63}.loss{background:#a32c38}</style></head><body><header><nav class="nav"><a class="brand" href="index.html"><img src="assets/andfc-official-badge.jpg" alt="AND FC badge"><strong>AND FC</strong></a><a href="index.html">Home</a><a href="score-centre.html">Score Centre</a></nav></header><div class="page-hero"><div class="inner"><h1>Match Report Centre</h1><p>Senior team results, form and matchday summaries.</p></div></div><main class="container page-content"><section class="section"><h2>Team statistics and recent form</h2><p>Automatically calculated from recorded results. Not official league standings.</p><div class="grid" id="stats">Loading…</div></section><section class="section"><h2>Latest matchday reports</h2><div class="grid" id="reports"></div></section><a href="index.html">Return to homepage</a></main><footer class="footer">Ability Not Disability · AND FC <span id="year"></span></footer><script src="site.js"></script><script>(async()=>{const data=await read('data/score-centre.json');if(!Array.isArray(data)){document.getElementById('stats').textContent='Results unavailable.';return}const teams=[['Eagles','Jim'],['Hawks','Ryan Hamilton'],['Cubs','William Lowry']];const result=m=>m[1]>m[2]?'W':m[1]===m[2]?'D':'L';for(const [team,coach] of teams){const rows=data.filter(r=>r.team===team).sort((a,b)=>a.date.localeCompare(b.date));const matches=rows.flatMap(r=>r.matches);const w=matches.filter(m=>result(m)==='W').length,d=matches.filter(m=>result(m)==='D').length;const gf=matches.reduce((s,m)=>s+m[1],0),ga=matches.reduce((s,m)=>s+m[2],0);const card=document.createElement('article');card.className='card';card.innerHTML='<h3>'+team+'</h3><p>Coach: '+coach+'</p><p>Played: '+matches.length+' · Won: '+w+' · Drawn: '+d+' · Lost: '+(matches.length-w-d)+'</p><p>Goals for: '+gf+' · Against: '+ga+' · Win rate: '+(matches.length?Math.round(w/matches.length*100):0)+'%</p><div class="form-guide" aria-label="Recent form, oldest first">'+matches.slice(-5).map(m=>'<span class="'+({W:'win',D:'draw',L:'loss'}[result(m)])+'">'+result(m)+'</span>').join('')+'</div>';document.getElementById('stats').append(card);const latest=rows.at(-1);if(!latest)continue;const report=document.createElement('article');report.className='card';report.innerHTML='<h3>'+team+' – Coach '+coach+'</h3><p>'+esc(latest.date)+'</p><p>'+latest.matches.filter(m=>result(m)==='W').length+' wins from '+latest.matches.length+' matches.</p><ul>'+latest.matches.map(m=>'<li>'+esc(m[0])+' — '+m[1]+'–'+m[2]+' ('+result(m)+')</li>').join('')+'</ul><p>Recorded scorers: '+(latest.scorers?Object.entries(latest.scorers).map(([n,v])=>esc(n)+' ×'+v).join(', '):'Not recorded')+'</p><p>Focus moving forward: teamwork, communication and continued player development.</p>';document.getElementById('reports').append(report)}document.getElementById('stats').firstChild?.nodeType===3&&document.getElementById('stats').firstChild.remove()})();</script></body></html>
