name: Club Hub Firestore security tests
on:
  pull_request:
    paths:
      - 'backend/combined-firestore.rules'
      - 'backend/tests/**'
      - '.github/workflows/hub-security-tests.yml'
  workflow_dispatch:
jobs:
  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator and testing libraries
        run: npm install --no-save firebase-tools@latest firebase@latest @firebase/rules-unit-testing@latest
      - name: Test Firestore rules against local emulator
        run: npx firebase emulators:exec --only firestore --project andfc-hub-rules-test "node backend/tests/hub-security.cjs"
