<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News Archive | AND FC</title><link rel="stylesheet" href="style.css"></head><body><header><nav class="nav"><a class="brand" href="index.html"><img src="assets/andfc-official-badge.jpg" alt="AND FC badge"><strong>AND FC</strong></a><a href="index.html">Home</a><a href="news.html">Latest news</a></nav></header><main class="container"><section class="section"><h1>Club News Archive</h1><p>Browse club news by month and year.</p><div id="archive">Loading news…</div></section></main><footer class="footer">AND FC <span id="year"></span></footer><script src="site.js"></script><script>(async()=>{const items=await loadNews();const root=document.getElementById('archive');root.replaceChildren();const groups=new Map();for(const item of items){const key=/^\d{4}-\d{2}/.test(item.date||'')?item.date.slice(0,7):'Undated';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(item)}for(const [key,stories] of groups){const section=document.createElement('details');section.className='card';const heading=document.createElement('summary');heading.textContent=(key==='Undated'?key:new Date(key+'-01T12:00:00Z').toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'}))+' ('+stories.length+')';section.append(heading);const grid=document.createElement('div');grid.className='grid';grid.innerHTML=stories.map(x=>entryCard(x,'news',true)).join('');section.append(grid);root.append(section)}if(!items.length)root.textContent='No news available.';else root.firstElementChild.open=true})();</script></body></html>
