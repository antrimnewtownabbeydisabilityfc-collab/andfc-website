
name: Update content indexes

on:
  push:
    branches:
      - main
    paths:
      - 'data/news/**'
      - 'data/fixtures/**'
      - 'data/gallery/**'
      - 'data/events/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-indexes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update JSON indexes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for name in ['news', 'fixtures', 'gallery', 'events']:
              folder = Path('data') / name
              folder.mkdir(parents=True, exist_ok=True)
              files = sorted(
                  p.name for p in folder.glob('*.json')
                  if p.name != 'index.json'
              )
              (folder / 'index.json').write_text(
                  json.dumps(files, indent=2) + '\n'
              )
          PY

      - name: Commit updated indexes
        run: |
          git config user.name "AND FC Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*/index.json
          if ! git diff --cached --quiet; then
            git commit -m "Update website content indexes"
            git push
          fi
